# Upgrade check, per-app screen: the per-app settings screen is in front (upgrade-check.sh opens
# it). The three apps the 2.1.3 seed gave a rule (Calendar and Messages blacklisted, Clock
# incognito) sort to the top of the list with their rule icon set.
appId: arun.com.chromer.debug
---
- extendedWaitUntil:
    visible: "com.google.android.calendar"
    timeout: 20000
- assertVisible: "com.google.android.deskclock"
- assertVisible: "com.google.android.apps.messaging"
- takeScreenshot: ${OUT}/per-app
- back
