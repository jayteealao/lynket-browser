# The overlay explainer on the browsing mode screen, then the system "Display over other apps"
# screen. Open the screen first, through the main activity, with the permission denied:
#   adb shell appops set arun.com.chromer.debug SYSTEM_ALERT_WINDOW deny
#   adb shell am start -n arun.com.chromer.debug/arun.com.chromer.MainActivity -f 0x24000000 --es arun.com.chromer.extra.DESTINATION BrowsingMode
# Run: maestro --device <serial> test android-app/maestro/webheads/permission.yaml
appId: arun.com.chromer.debug
---
- extendedWaitUntil:
    visible: "Browsing mode"
    timeout: 10000
- tapOn: "Web heads"
- extendedWaitUntil:
    visible: "Allow web heads to float"
    timeout: 5000
- assertVisible: "Not now"
- takeScreenshot: permission-explainer
- tapOn: "Grant"
- extendedWaitUntil:
    visible:
      text: ".*(Display over other apps|Appear on top).*"
    timeout: 10000
- takeScreenshot: permission-system-screen
