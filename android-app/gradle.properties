org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2048m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# Configuration cache
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=OFFICIAL
# AGP Configuration
# Deps
android.includeDependencyInfoInApks=false
android.dependencyResolutionAtConfigurationTime.disallow=true
# Tests
# android.experimental.androidTest.useUnifiedTestPlatform=true
# android.androidTest.shardBetweenDevices=true

# Build features
android.enableBuildConfigAsBytecode=true
# Disable resources processing for library module by default
android.library.defaults.buildfeatures.androidresources=false
