<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home search bar</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css">
<style>body { margin: 0; padding: 24px; font: 14px/1.45 Roboto, system-ui, sans-serif; background: var(--surface); color: var(--on-surface); }
h2 { font-size: 14px; margin: 20px 0 8px; } .frame { max-width: 360px; position: relative; } .frame.tall { min-height: 140px; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dark { background: var(--surface-dark); color: var(--on-surface-dark); padding: 12px; border-radius: 16px; }</style>
</head><body><h1 style="font-size:20px">Home search bar</h1><h2>Collapsed (no change)</h2><div class="frame"><div data-component="home-search-bar" class="search-bar"><span class="ib" role="button" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span class="ph">Search or type URL</span><span class="ib" role="button" aria-label="Voice search"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></div></div><h2>Typed</h2><div class="frame"><div data-component="home-search-bar" class="search-bar"><span class="ib" role="button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></span><span class="ph typed">compose lists</span><span class="ib" role="button" aria-label="Voice search"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></div></div><h2>Dark</h2><div class="frame dark"><div data-component="home-search-bar" class="search-bar"><span class="ib" role="button" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span class="ph">Search or type URL</span><span class="ib" role="button" aria-label="Voice search"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></div></div>
<script>
function midEllipsis(){document.querySelectorAll('.u[data-full]').forEach(function(el){var f=el.dataset.full;el.textContent=f;if(!el.clientWidth||el.scrollWidth<=el.clientWidth)return;var lo=1,hi=f.length;function put(n){el.textContent=f.slice(0,Math.ceil(n/2))+'\u2026'+f.slice(f.length-Math.floor(n/2));}while(lo<hi){var m=(lo+hi+1)>>1;put(m);if(el.scrollWidth<=el.clientWidth)lo=m;else hi=m-1;}put(lo);});}
addEventListener('load',midEllipsis);addEventListener('resize',midEllipsis);
</script></body></html>
