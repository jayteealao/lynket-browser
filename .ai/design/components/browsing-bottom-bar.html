<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browsing bottom bar</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css">
<style>body { margin: 0; padding: 24px; font: 14px/1.45 Roboto, system-ui, sans-serif; background: var(--surface); color: var(--on-surface); }
h2 { font-size: 14px; margin: 20px 0 8px; } .frame { max-width: 360px; position: relative; } .frame.tall { min-height: 140px; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dark { background: var(--surface-dark); color: var(--on-surface-dark); padding: 12px; border-radius: 16px; }</style>
</head><body><h1 style="font-size:20px">Browsing bottom bar</h1><h2>Four items</h2><div class="frame"><div data-component="browsing-bottom-bar" class="bbar"><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>Copy link</span></span><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></svg><span>Share</span></span><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5h10v2M9 5v14M14 12v-1h6v1M17 11v8"/></svg><span>Text size</span></span><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Open in browser</span></span></div></div><h2>Dark</h2><div class="frame dark"><div data-component="browsing-bottom-bar" class="bbar"><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>Copy link</span></span><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></svg><span>Share</span></span><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5h10v2M9 5v14M14 12v-1h6v1M17 11v8"/></svg><span>Text size</span></span><span class="bi" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Open in browser</span></span></div></div>
<script>
function midEllipsis(){document.querySelectorAll('.u[data-full]').forEach(function(el){var f=el.dataset.full;el.textContent=f;if(!el.clientWidth||el.scrollWidth<=el.clientWidth)return;var lo=1,hi=f.length;function put(n){el.textContent=f.slice(0,Math.ceil(n/2))+'\u2026'+f.slice(f.length-Math.floor(n/2));}while(lo<hi){var m=(lo+hi+1)>>1;put(m);if(el.scrollWidth<=el.clientWidth)lo=m;else hi=m-1;}put(lo);});}
addEventListener('load',midEllipsis);addEventListener('resize',midEllipsis);
</script></body></html>
